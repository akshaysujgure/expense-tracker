name: Daily Expense Processing
on:
 schedule:
   - cron: "0 2 * * *"
 workflow_dispatch:
jobs:
 process:
   runs-on: ubuntu-latest
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.12"
     - name: Install dependencies
       run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt
     - name: Run processor
       run: |
         python - <<'PY'
         from processor.analytics import generate_processed_data
         generate_processed_data("data/raw", "data/processed")
         PY
     - name: Commit processed analytics
       run: |
         git config user.name "github-actions[bot]"
         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         if git diff --quiet -- data/processed; then
           echo "No processed data changes"
         else
           git add data/processed
           git commit -m "Update processed analytics"
           git push
         fi
